<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23000'/><path d='M8 22 16 9l8 13' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linejoin='round'/><path d='M16 9v13' stroke='%23a1a1aa' stroke-width='2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <!-- set the theme before first paint, so the wrong one never flashes -->
    <script>try{var t=localStorage.getItem("pq.theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;if(t==="light")document.querySelector("meta[name=theme-color]").content="#F5F2E6"}catch(e){}</script>
    <meta name="description" content="SixtyFy. A strategy game about your own retirement, built on the National Pension System." />
    <title>SixtyFy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
