# Serving the built frontend (dist/) from nginx, e.g. inside infra/nginx.conf's server block.
# Not wired into infra/ yet: docker-compose has no frontend service.

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
# brotli on;  brotli_types text/css application/javascript application/json image/svg+xml;
#             (needs the ngx_brotli module)

root /usr/share/nginx/html;

# hashed, content-addressed assets: cache forever
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# the app shell: always revalidate; client-side routes fall back to it
location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
